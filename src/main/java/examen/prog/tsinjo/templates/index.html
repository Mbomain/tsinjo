
<!-- index.html -->
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsinjo - Gestion des Dons et Aides</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .transaction-card {
            border-left: 4px solid;
            margin-bottom: 15px;
        }
        .donation-card {
            border-left-color: #28a745;
        }
        .aide-card {
            border-left-color: #007bff;
        }
        .form-section {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .transaction-type-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        .amount-display {
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <h1 class="text-center mb-4">
                <i class="fas fa-heart text-danger"></i>
                Tsinjo - Plateforme de Dons
            </h1>

            <!-- Messages de succès/erreur -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulaire de donation -->
            <div class="form-section">
                <h3 class="mb-3">
                    <i class="fas fa-donate text-success"></i>
                    Faire un don
                </h3>

                <form th:action="@{/donation}" th:object="${donationForm}" method="post" class="row g-3">
                    <div class="col-md-6">
                        <label for="donorName" class="form-label">Nom complet *</label>
                        <input type="text"
                               class="form-control"
                               th:class="${#fields.hasErrors('donorName')} ? 'form-control is-invalid' : 'form-control'"
                               id="donorName"
                               th:field="*{donorName}"
                               placeholder="Votre nom complet">
                        <div th:if="${#fields.hasErrors('donorName')}" class="invalid-feedback">
                            <span th:errors="*{donorName}"></span>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="donorEmail" class="form-label">Email *</label>
                        <input type="email"
                               class="form-control"
                               th:class="${#fields.hasErrors('donorEmail')} ? 'form-control is-invalid' : 'form-control'"
                               id="donorEmail"
                               th:field="*{donorEmail}"
                               placeholder="votre.email@exemple.com">
                        <div th:if="${#fields.hasErrors('donorEmail')}" class="invalid-feedback">
                            <span th:errors="*{donorEmail}"></span>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="amount" class="form-label">Montant *</label>
                        <input type="number"
                               class="form-control"
                               th:class="${#fields.hasErrors('amount')} ? 'form-control is-invalid' : 'form-control'"
                               id="amount"
                               th:field="*{amount}"
                               step="0.01"
                               min="0.01"
                               placeholder="0.00">
                        <div th:if="${#fields.hasErrors('amount')}" class="invalid-feedback">
                            <span th:errors="*{amount}"></span>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="devise" class="form-label">Devise *</label>
                        <select class="form-select"
                                th:class="${#fields.hasErrors('devise')} ? 'form-select is-invalid' : 'form-select'"
                                id="devise"
                                th:field="*{devise}">
                            <option value="">Choisir une devise</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="USD">USD - Dollar US</option>
                            <option value="MGA">MGA - Ariary Malgache</option>
                        </select>
                        <div th:if="${#fields.hasErrors('devise')}" class="invalid-feedback">
                            <span th:errors="*{devise}"></span>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="typePayment" class="form-label">Mode de paiement *</label>
                        <select class="form-select"
                                th:class="${#fields.hasErrors('typePayment')} ? 'form-select is-invalid' : 'form-select'"
                                id="typePayment"
                                th:field="*{typePayment}">
                            <option value="">Choisir un mode</option>
                            <option value="CARTE_BANCAIRE">Carte bancaire</option>
                            <option value="VIREMENT">Virement</option>
                            <option value="MOBILE_MONEY">Mobile Money</option>
                            <option value="PAYPAL">PayPal</option>
                        </select>
                        <div th:if="${#fields.hasErrors('typePayment')}" class="invalid-feedback">
                            <span th:errors="*{typePayment}"></span>
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-heart"></i>
                            Faire un don
                        </button>
                    </div>
                </form>
            </div>

            <!-- Liste des transactions -->
            <div class="row">
                <div class="col-12">
                    <h3 class="mb-4">
                        <i class="fas fa-list"></i>
                        Historique des transactions
                        <span class="badge bg-secondary ms-2" th:text="|${#lists.size(transactions)} transactions|"></span>
                    </h3>

                    <div th:if="${#lists.isEmpty(transactions)}" class="alert alert-info text-center">
                        <i class="fas fa-info-circle"></i>
                        Aucune transaction trouvée. Faites le premier don !
                    </div>

                    <div th:unless="${#lists.isEmpty(transactions)}">
                        <div th:each="transaction : ${transactions}"
                             class="card transaction-card"
                             th:classappend="${transaction.type} == 'DONATION' ? 'donation-card' : 'aide-card'">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <div class="d-flex align-items-center mb-2">
                                                <span th:if="${transaction.type} == 'DONATION'"
                                                      class="badge bg-success transaction-type-badge me-2">
                                                    <i class="fas fa-heart"></i> DON
                                                </span>
                                            <span th:if="${transaction.type} == 'AIDE'"
                                                  class="badge bg-primary transaction-type-badge me-2">
                                                    <i class="fas fa-hands-helping"></i> AIDE
                                                </span>
                                            <h5 class="card-title mb-0" th:text="${transaction.personName}"></h5>
                                        </div>

                                        <p class="card-text mb-1">
                                            <i class="fas fa-envelope text-muted"></i>
                                            <span th:text="${transaction.personEmail}"></span>
                                        </p>

                                        <p class="card-text mb-1">
                                            <i class="fas fa-calendar text-muted"></i>
                                            <span th:text="${#temporals.format(transaction.transactionDate, 'dd/MM/yyyy')}"></span>
                                            <small class="text-muted ms-2">
                                                (créé le <span th:text="${#temporals.format(transaction.creationInstant, 'dd/MM/yyyy HH:mm')}"></span>)
                                            </small>
                                        </p>

                                        <p class="card-text">
                                            <i class="fas fa-credit-card text-muted"></i>
                                            <span th:text="${transaction.typePayment}"></span>
                                        </p>

                                        <!-- Notification spéciale pour les aides -->
                                        <div th:if="${transaction.type} == 'AIDE' and ${transaction.notifHelp}"
                                             class="alert alert-info mt-2 mb-0">
                                            <i class="fas fa-info-circle"></i>
                                            <strong>Note:</strong>
                                            <span th:text="${transaction.notifHelp}"></span>
                                        </div>
                                    </div>

                                    <div class="col-md-4 text-end">
                                        <div class="amount-display"
                                             th:classappend="${transaction.type} == 'DONATION' ? 'text-success' : 'text-primary'">
                                            <span th:if="${transaction.type} == 'DONATION'">+</span>
                                            <span th:if="${transaction.type} == 'AIDE'">-</span>
                                            <span th:text="${#numbers.formatDecimal(transaction.amount, 0, 2)}"></span>
                                            <span th:text="${transaction.devise}"></span>
                                        </div>
                                        <small class="text-muted">
                                            ID: <span th:text="${#strings.substring(transaction.id, 0, 8)}"></span>...
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Statistiques rapides -->
            <div class="row mt-4" th:unless="${#lists.isEmpty(transactions)}">
                <div class="col-md-6">
                    <div class="card bg-success text-white">
                        <div class="card-body text-center">
                            <h5 class="card-title">
                                <i class="fas fa-heart"></i>
                                Total des dons
                            </h5>
                            <p class="card-text fs-4" id="totalDonations">
                                Chargement...
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card bg-primary text-white">
                        <div class="card-body text-center">
                            <h5 class="card-title">
                                <i class="fas fa-hands-helping"></i>
                                Total des aides
                            </h5>
                            <p class="card-text fs-4" id="totalAides">
                                Chargement...
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    // Calculer les statistiques côté client
    document.addEventListener('DOMContentLoaded', function() {
        const transactions = /*[[${transactions}]]*/ [];

        let totalDonations = 0;
        let totalAides = 0;
        let devises = new Set();

        transactions.forEach(transaction => {
            devises.add(transaction.devise);
            if (transaction.type === 'DONATION') {
                totalDonations += transaction.amount;
            } else if (transaction.type === 'AIDE') {
                totalAides += transaction.amount;
            }
        });

        const totalDonationsEl = document.getElementById('totalDonations');
        const totalAidesEl = document.getElementById('totalAides');

        if (totalDonationsEl && totalAidesEl) {
            const mainDevise = devises.size > 0 ? Array.from(devises)[0] : 'EUR';

            totalDonationsEl.textContent = totalDonations.toFixed(2) + ' ' + mainDevise;
            totalAidesEl.textContent = totalAides.toFixed(2) + ' ' + mainDevise;
        }
    });

    // Auto-dismiss des alertes après 5 secondes
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert-dismissible');
        alerts.forEach(alert => {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 5000);
</script>
</body>
</html>
